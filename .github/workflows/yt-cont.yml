name: yt-cont-fetch3
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/yt-cont.yml' ]
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect playlist with show-unavailable params (v3)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          PL = "PLyzTA8cetPdHtlGw1X8Kt7Ea4bd27ApR7"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def post_raw(url, obj):
              req = urllib.request.Request(url, data=json.dumps(obj).encode("utf-8"),
                  headers={"User-Agent": UA, "Content-Type": "application/json", "Accept-Language": "en-US,en;q=0.9"})
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return r.status, r.read().decode("utf-8", "ignore")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "ignore")

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "en-US,en;q=0.9"})
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.read().decode("utf-8", "ignore")

          def guess_title(o):
              md = (o.get("lockupMetadataViewModel") or {})
              if isinstance(md, dict) and md.get("title", {}).get("content"):
                  return md["title"]["content"]
              t = o.get("title")
              if isinstance(t, dict):
                  if t.get("simpleText"): return t["simpleText"]
                  if t.get("runs") and t["runs"][0].get("text"): return t["runs"][0]["text"]
              return o.get("headline") or o.get("accessibility", {}).get("accessibilityData", {}).get("label")

          def walk(o, rows, anyv, rkeys, depth=0):
              if depth > 140: return
              if isinstance(o, dict):
                  for k, v in o.items():
                      if isinstance(v, dict) and (k.endswith("Renderer") or k.endswith("ViewModel")):
                          rkeys[k] = rkeys.get(k, 0) + 1
                  if isinstance(o.get("lockupViewModel"), dict):
                      l = o["lockupViewModel"]
                      t = l.get("metadata", {}).get("lockupMetadataViewModel", {}).get("title", {}).get("content")
                      if l.get("contentId") and t: rows.append((l["contentId"], t))
                  for rk in ("playlistVideoRenderer", "playlistPanelVideoRenderer"):
                      if isinstance(o.get(rk), dict):
                          p = o[rk]
                          vid = p.get("videoId"); t = guess_title(p)
                          if vid and t: rows.append((vid, t))
                  vid = o.get("videoId")
                  if isinstance(vid, str) and len(vid) == 11:
                      if vid not in [a[0] for a in anyv]:
                          anyv.append((vid, guess_title(o) or ""))
                  for v in o.values(): walk(v, rows, anyv, rkeys, depth+1)
              elif isinstance(o, list):
                  for v in o: walk(v, rows, anyv, rkeys, depth+1)

          html = get(f"https://www.youtube.com/playlist?list={PL}&hl=en&gl=US")
          mkey = re.search(r'"INNERTUBE_API_KEY":"([^"]+)"', html)
          KEY = mkey.group(1) if mkey else "AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8"
          mver = re.search(r'"INNERTUBE_CLIENT_VERSION":"([^"]+)"', html)
          VER = mver.group(1) if mver else "2.20261029.11.00"
          m = re.search(r"var ytInitialData = (\{.*?\})\s*;</script>", html, re.S)
          d0 = json.loads(m.group(1))
          rows0, any0, keys0 = [], [], {}
          walk(d0, rows0, any0, keys0)
          print("INIT rows:", len(rows0), "anyVideoIds:", len(any0), flush=True)

          ctx = {"client": {"clientName": "WEB", "clientVersion": VER, "hl": "en", "gl": "US"}}
          url = f"https://www.youtube.com/youtubei/v1/browse?key={KEY}&prettyPrint=false"

          print("=== BROWSE with params=wgYCCAA= (show unavailable) ===", flush=True)
          st, body = post_raw(url, {"context": ctx, "browseId": "VL" + PL, "params": "wgYCCAA="})
          print("HTTP", st, "LEN", len(body), flush=True)
          try:
              d1 = json.loads(body)
          except Exception as e:
              print("JSON ERR", repr(e), body[:800], flush=True); d1 = {}
          rows1, any1, keys1 = [], [], {}
          walk(d1, rows1, any1, keys1)
          print("RESP rows:", len(rows1), "anyVideoIds:", len(any1), flush=True)
          print("RESP_KEYS", json.dumps(keys1, sort_keys=True)[:2000], flush=True)

          known = set(v for v, _ in any0) | set(v for v, _ in rows0)
          print("--- ALL videoIds from params response ---", flush=True)
          for vid, t in any1:
              mark = "NEW" if vid not in known else "   "
              print(f"ID|{mark}|{vid}|{t}", flush=True)
          newrows = [(v, t) for v, t in rows1 if v not in known]
          print("--- NEW titled rows ---", flush=True)
          for v, t in newrows:
              print(f"NEW|{v}|{t}", flush=True)

          print("=== ALSO BROWSE plain browseId (control) ===", flush=True)
          st2, body2 = post_raw(url, {"context": ctx, "browseId": "VL" + PL})
          d2 = json.loads(body2) if st2 == 200 else {}
          rows2, any2, keys2 = [], [], {}
          walk(d2, rows2, any2, keys2)
          print("PLAIN rows:", len(rows2), "anyVideoIds:", len(any2), "HTTP", st2, flush=True)
          only_plain = [v for v, _ in any2 if v not in known]
          print("PLAIN-only ids:", only_plain, flush=True)
          print("===END===", flush=True)
          PY
